<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 20px; }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
        }
        button:hover { background-color: #357ae8; }
        .error { color: #d9534f; font-weight: bold; margin-top: 15px; }
        .info { color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Portal</h2>
    <p class="info">Please log in with the authorized Google account to proceed.</p>
    <button id="login-btn">Sign in with Google</button>
    <p id="error-msg" class="error"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCZbCr-Zt5KQblRQ8Pk58KuinCVP-TlXGo",
        authDomain: "happynonvegpickles-f2636.firebaseapp.com",
        projectId: "happynonvegpickles-f2636",
        storageBucket: "happynonvegpickles-f2636.firebasestorage.app",
        messagingSenderId: "802823212924",
        appId: "1:802823212924:web:d82c92737ffa950798def9",
        measurementId: "G-18GP45EWTT"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const ALLOWED_ADMIN = "harshavardhanjw@gmail.com";
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    // Trigger Google Login Popup
    loginBtn.addEventListener('click', () => {
        errorMsg.textContent = ""; 
        signInWithPopup(auth, provider)
            .then((result) => {
                if (result.user.email !== ALLOWED_ADMIN) {
                    signOut(auth).then(() => {
                        errorMsg.textContent = "Access Denied: Unauthorized email.";
                    });
                }
            })
            .catch((error) => {
                errorMsg.textContent = "Authentication Error: " + error.message;
            });
    });

    // Monitor Authentication State
    onAuthStateChanged(auth, (user) => {
        if (user) {
            if (user.email === ALLOWED_ADMIN) {
                // Redirect straight to navbar.html if authorized
                window.location.href = "dashboard.html";
            } else {
                // Instantly log out unauthorized users
                signOut(auth);
            }
        }
    });
</script>

</body>
</html>
